# CI — chạy trên mọi push và pull request vào main (và demo).
# Chỉ kiểm tra build, KHÔNG deploy (deploy demo nằm ở deploy-demo.yml, cần secrets).
name: CI

on:
  push:
    branches: [main, demo]
  pull_request:
    branches: [main, demo]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cài Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Cài dependencies backend
        working-directory: backend
        run: npm ci

      - name: Typecheck backend (TypeScript)
        working-directory: backend
        run: npx tsc --noEmit

      - name: Cài dependencies frontend
        working-directory: frontend
        run: npm ci

      - name: Typecheck frontend (TypeScript)
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Kiểm tra file tĩnh frontend
        working-directory: frontend
        run: |
          test -f index.html || (echo "Thiếu index.html" && exit 1)
          test -f manifest.webmanifest || (echo "Thiếu manifest.webmanifest" && exit 1)
          test -f dist/app.js || (echo "Thiếu dist/app.js (chưa build?)" && exit 1)
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); console.log('manifest: JSON hợp lệ')"
          node --check sw.js && echo "sw.js: cú pháp hợp lệ"
          # Mọi import tương đối trong dist/*.js phải có đuôi .js và trỏ tới file thật,
          # nếu không trình duyệt từ chối module vì MIME text/html (lỗi từng gặp 2026-10-17).
          node -e "
            const fs=require('fs'),path=require('path');
            let bad=0;
            const walk=d=>fs.readdirSync(d,{withFileTypes:true}).flatMap(e=>e.isDirectory()?walk(path.join(d,e.name)):[path.join(d,e.name)]);
            for(const f of walk('dist').filter(f=>f.endsWith('.js'))){
              const dir=path.dirname(f);
              for(const m of fs.readFileSync(f,'utf8').matchAll(/from\s+\"(\.[^\"]+)\"/g)){
                if(!m[1].endsWith('.js')||!fs.existsSync(path.join(dir,m[1]))){console.error('IMPORT HONG:',f,'->',m[1]);bad=1;}
              }
            }
            if(bad)process.exit(1); console.log('imports: mọi module đều phân giải được');
          "

      - name: Build Worker (dry-run, không deploy thật)
        working-directory: backend
        run: npx wrangler deploy --dry-run --outdir dist
