# Deploy demo — chạy khi push vào nhánh `demo` SAU KHI CI đạt.
# Kiến trúc demo (từ 2026-10-17): Worker phục vụ CẢ frontend (Static Assets)
# lẫn API trên cùng một origin — không còn CORS/preflight/cookie cross-site.
# Cần secrets (xem README.md bước thủ công):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
# Cần vars:
#   WORKER_URL — địa chỉ Worker demo, ví dụ https://sop-api.dungnt-storage.workers.dev
# Theo SPEC §13.8: workflow DỪNG ngay nếu migration hoặc smoke test thất bại.
name: Deploy demo

on:
  push:
    branches: [demo]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cài Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

      - name: Đóng dấu bản build vào service worker (chống kẹt cache cũ)
        working-directory: frontend
        run: |
          test -f sw.js || (echo "Thiếu sw.js" && exit 1)
          grep -q "__BUILD_ID__" sw.js || (echo "sw.js thiếu placeholder __BUILD_ID__" && exit 1)
          sed -i "s/__BUILD_ID__/${GITHUB_SHA::7}/" sw.js
          grep -q "__BUILD_ID__" sw.js && (echo "Chưa thay được BUILD_ID" && exit 1)
          echo "sw.js đã đóng dấu bản ${GITHUB_SHA::7}"

      - name: Sinh config.js (cùng origin — apiBase rỗng)
        working-directory: frontend
        run: |
          printf 'window.SOP_CONFIG = { apiBase: "" };' > config.js
          echo "config.js: apiBase rỗng (frontend và API cùng origin)"

      - name: Cài dependencies backend
        working-directory: backend
        run: npm ci

      - name: Áp dụng migration D1 (remote)
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply sop_demo_db --remote

      - name: Deploy Worker (kèm frontend Static Assets)
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Cấu hình Telegram secrets
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_USERNAME: ${{ secrets.TELEGRAM_BOT_USERNAME }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            printf '%s' "$TELEGRAM_BOT_TOKEN" | npx wrangler secret put TELEGRAM_BOT_TOKEN
            printf '%s' "$TELEGRAM_BOT_USERNAME" | npx wrangler secret put TELEGRAM_BOT_USERNAME
            echo "Đã cấu hình Telegram secrets"
          else
            echo "Chưa có TELEGRAM_BOT_TOKEN — bỏ qua"
          fi

      - name: Smoke test /health + auth + frontend
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
        run: |
          test -n "$WORKER_URL" || (echo "Chưa cấu hình vars.WORKER_URL — xem README." && exit 1)
          curl -sf "$WORKER_URL/health" | grep -q '"status":"ok"' \
            && echo "Smoke test /health: ĐẠT" \
            || (echo "Smoke test /health: THẤT BẠI" && exit 1)
          # Auth route phải trả 401 (chưa đăng nhập) — chứng tỏ đã deploy đúng bản có auth.
          test "$(curl -s -o /dev/null -w '%{http_code}' "$WORKER_URL/api/v1/auth/session")" = "401" \
            && echo "Smoke test /api/v1/auth/session (401 khi chưa login): ĐẠT" \
            || (echo "Smoke test auth: THẤT BẠI" && exit 1)
          # Trang chủ frontend phải được phục vụ cùng origin.
          curl -sf "$WORKER_URL/" | grep -q "SOP" \
            && echo "Smoke test / (frontend cùng origin): ĐẠT" \
            || (echo "Smoke test frontend: THẤT BẠI" && exit 1)
